<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ремесленная мастерская</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background: #F7F3EB; color: #1C2622; }
        h1, h2, h3 { font-family: 'Playfair Display', serif; }
        .container { max-width: 1000px; margin: 0 auto; padding: 20px; }
        .btn { display: inline-block; padding: 15px 40px; border-radius: 100px; background: #C5A56A; color: #1C2622; font-weight: 700; text-decoration: none; margin-top: 20px; }
        .btn:hover { background: #B0904F; }
        .gallery { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 30px; }
        .gallery img { width: 100%; border-radius: 20px; }
        .header-img { width: 100%; height: 400px; object-fit: cover; border-radius: 20px; margin-bottom: 20px; }
        a.back { color: #C5A56A; text-decoration: none; font-size: 14px; }
    </style>
</head>
<body>
    <div class="container">
        <a href="index.html" class="back">← На главную</a>
        <h1>Ремесленная мастерская</h1>
        <img class="header-img" src="https://images.unsplash.com/photo-1452860606245-08befc0ff44b?q=80&w=2070&auto=format&fit=crop" alt="Мастерская">
        <p>Мастер-классы по резьбе, гончарному делу, плетению из бересты. Гончарное искусство: 1 800 ₽ · 2 часа. Резьба по дереву: 2 200 ₽ · 3 часа. Плетение из бересты: 1 500 ₽ · 1.5 часа.</p>
        
        <div class="gallery">
            <img src="https://images.unsplash.com/photo-1565193566173-7a0ee3dbe261?q=80&w=2070&auto=format&fit=crop" alt="Гончарное дело">
            <img src="https://images.unsplash.com/photo-1601050690597-df0568f70950?q=80&w=2070&auto=format&fit=crop" alt="Резьба">
        </div>
        
        <a href="index.html#booking" class="btn">Записаться на мастер-класс</a>
    </div>
</body>
</html>
